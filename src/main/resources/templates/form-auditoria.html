<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Auditoría</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            max-width: 400px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Crear nueva auditoría</h2>

    <form th:action="@{/auditorias/nueva}" th:object="${auditoria}" method="post">
        <label for="id">ID:</label>
        <input type="number" th:field="*{id}" id="id" required>

        <label for="descripcion">Descripción:</label>
        <input type="text" th:field="*{descripcion}" id="descripcion" required>

        <label for="fecha">Fecha:</label>
        <input type="date" th:field="*{fecha}" id="fecha" required>

        <button type="submit">Generar reporte</button>
    </form>

    <a class="back-link" th:href="@{/}">⬅ Volver al inicio</a>
</body>
</html>
