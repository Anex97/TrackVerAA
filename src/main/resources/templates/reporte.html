<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reporte Preliminar</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Reporte Preliminar</h2>
    <p><b>ID:</b> <span th:text="${reporte.id}"></span></p>
    <p><b>Fecha:</b> <span th:text="${reporte.fecha}"></span></p>
    <p><b>Autor:</b> <span th:text="${reporte.autor}"></span></p>
    <p><b>Descripción:</b> <span th:text="${reporte.descripcion}"></span></p>
</body>
</html>
