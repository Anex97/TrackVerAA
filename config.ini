# Configuración del servidor web para TrackVer A&A
# Este archivo permite personalizar la configuración del servidor

[servidor]
# Puerto en el que se ejecutará el servidor HTTP
puerto = 8000

# Delay en segundos antes de abrir el navegador automáticamente
delay_navegador = 2

# Si se debe abrir el navegador automáticamente (true/false)
abrir_navegador = true

# Página inicial a la que se redirigirá el navegador
# Opciones comunes:
# /10_HTML/ - Página principal del frontend
# /10_HTML/Index.html - Página de login
# /10_HTML/Panel.html - Dashboard
pagina_inicial = /10_HTML/