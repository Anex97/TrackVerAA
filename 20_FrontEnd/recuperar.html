<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Recuperar Contraseña</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header estándar -->
  <header>
    <div class="header-container">
      <div class="logo-container">
        <img src="img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="login-contenedor">
      <h2>Recuperar Contraseña</h2>
      <form class="login-form">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="Ingresa tu correo" required>

        <button type="submit">Enviar enlace de recuperación</button>
      </form>
      <p class="login-extra">¿Recordaste tu contraseña? <a href="index.html">Inicia sesión aquí</a></p>
    </section>
  </main>
</body>
</html>
