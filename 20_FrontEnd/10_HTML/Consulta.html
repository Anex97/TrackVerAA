<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Consulta</title>
  <link rel="stylesheet" href="../styles.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo-container">
        <img src="../img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
    <nav>
      <ul class="nav-menu">
        <li><a href="Panel.html">Panel Principal</a></li>
        <li><a href="Registro.html">Registrar GPS</a></li>
        <li><a href="Consulta.html">Consultar Registros</a></li>
        <li><a href="alertas.html">Alertas</a></li>
        <li><a href="Index.html">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="consulta-contenedor">
      <!-- Tabla + filtros -->
      <div class="tabla-contenedor">
        <h2>Registros</h2>

        <!-- Filtros -->
        <div class="filtros">
          <input type="text" id="filtroVehiculo" placeholder="Buscar por vehículo">
          <input type="text" id="filtroLat" placeholder="Latitud">
          <input type="text" id="filtroLon" placeholder="Longitud">
          <input type="text" id="filtroEstado" placeholder="Estado">
          <input type="date" id="filtroFechaInicio">
          <input type="date" id="filtroFechaFin">
          <button onclick="filtrarTabla()">Filtrar</button>
          <button onclick="resetTabla()">Mostrar todas</button>
          <button onclick="descargarCSV()">Descargar CSV</button>
        </div>

        <!-- Tabla -->
        <div class="table-container">
        <table class="consulta-tabla" id="tablaRegistros">
          <thead>
            <tr>
              <th data-sort="id">ID</th>
              <th data-sort="vehiculo">Vehículo</th>
              <th data-sort="latitud">Latitud</th>
              <th data-sort="longitud">Longitud</th>
              <th data-sort="estado">Estado</th>
              <th data-sort="fecha">Fecha</th>
            </tr>
          </thead>
          <tbody>
            <!-- filas generadas dinámicamente -->
          </tbody>
        </table>
        </div>
        <div id="msgNoLogin" style="color:#a00;margin-top:8px;"></div>
      </div>

      <!-- Mapa con Leaflet -->
      <div class="mapa-contenedor">
        <h2>Mapa de ubicaciones</h2>
        <div id="mapa" style="height: 400px; border-radius: 12px;"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 TrackVer A&A. Todos los derechos reservados.</p>
  </footer>

  <!-- Script -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../20_JavaScript/consulta.js"></script>
</body>
</html>
