<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Agregar Vehículo</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <!-- Header estándar -->
  <header>
    <div class="header-container">
      <div class="logo-container">
        <img src="../20_FrontEnd/img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <h1 class="titulo">TrackVer A&A</h1>
    </div>

    <!-- Menú de navegación -->
    <nav>
      <ul class="nav-menu">
        <li><a href="Panel.html">Panel Principal</a></li>
        <li><a href="Registro.html">Registrar GPS</a></li>
        <li><a href="Consulta.html">Consultar Registros</a></li>
        <li><a href="alertas.html">Alertas</a></li>
        <li><a href="Index.html">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="registro-contenedor">
      <!-- Vista previa -->
      <div class="preview">
        <h3>Vista previa del vehículo</h3>
        <p><strong>Marca:</strong> <span id="previewMarca">-</span></p>
        <p><strong>Modelo:</strong> <span id="previewModelo">-</span></p>
        <p><strong>Placas:</strong> <span id="previewPlacas">-</span></p>
        <p><strong>Año:</strong> <span id="previewAnio">-</span></p>
      </div>

      <!-- Formulario -->
      <form class="registro-form" id="vehiculoForm">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" placeholder="Ej. Volvo" required>

        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" placeholder="Ej. TR 430" required>

        <label for="placas">Placas:</label>
        <input type="text" id="placas" placeholder="Ej. ABC-123" required>

        <label for="anio">Año:</label>
        <input type="number" id="anio" placeholder="Ej. 2025" required>

        <button type="submit">Guardar Vehículo</button>
      </form>
    </section>
  </main>
  <footer class="footer">
    <p>© 2025 TrackVer A&A. Todos los derechos reservados.</p>
  </footer>

  <script src="../20_JavaScript/vehiculo.js"></script>
</body>
</html>
