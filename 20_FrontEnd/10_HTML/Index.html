<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Login</title>
  <link rel="stylesheet" href="../styles.css">
 </head>
 <body class="login-page">
  <!-- Sección del encabezado con logo y título -->
  <header>
    <div class="header-container">
      <!-- Logo alineado a la izquierda -->
      <div class="logo-container">
        <img src="../img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <!-- Título centrado -->
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
  </header>

  <!-- Área de contenido principal -->
  <main>
    <!-- Animated login container -->
    <section class="login-contenedor animated-login">
      <div class="login-card">
        <div class="login-brand">
          <img src="../img/logo.jpg" alt="logo" class="logo-sm">
          <h2>TrackVer A&A</h2>
        </div>
        <form class="login-form" id="loginForm">
          <div class="field">
            <input type="text" id="usuario" required autocomplete="username">
            <label for="usuario">Usuario</label>
          </div>
          <div class="field">
            <input type="password" id="password" required autocomplete="current-password">
            <label for="password">Contraseña</label>
          </div>
          <button type="submit" class="btn-login"><span class="btn-text">Acceder</span><span class="btn-shimmer"></span></button>
        </form>
        <div id="loginMessage" class="login-message" aria-live="polite"></div>
        <p class="login-extra">¿Olvidaste tu contraseña? <a href="recuperar.html">Recupérala aquí</a></p>
      </div>
    </section>
  </main>
  <!-- Sección del pie de página -->
  <footer class="footer">
    <p>© 2025 TrackVer A&A. Todos los derechos reservados.</p>
  </footer>

  <script src="../20_JavaScript/login.js"></script>
  <script src="../20_JavaScript/nav_auth.js"></script>
</body>
</html>
