<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header estándar -->
  <header>
    <div class="header-container">
      <!-- Logo alineado a la izquierda -->
      <div class="logo-container">
        <img src="img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <!-- Título centrado -->
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="login-contenedor">
      <h2>Iniciar Sesión</h2>
      <form class="login-form">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

        <button type="submit">Acceder</button>
      </form>
      <p class="login-extra">¿Olvidaste tu contraseña? 
        <a href="recuperar.html">Recupérala aquí</a>
      </p>
    </section>
  </main>
</body>
</html>
