<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Registro GPS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header estándar -->
  <header>
    <div class="header-container">
      <!-- Logo alineado a la izquierda -->
      <div class="logo-container">
        <img src="img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <!-- Título centrado -->
      <h1 class="titulo">TrackVer A&A</h1>
    </div>

    <!-- Menú de navegación -->
    <nav>
      <ul class="nav-menu">
        <li><a href="panel.html">Panel Principal</a></li>
        <li><a href="registro.html">Registrar GPS</a></li>
        <li><a href="consulta.html">Consultar Registros</a></li>
        <li><a href="alertas.html">Alertas</a></li>
        <li><a href="index.html">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <section class="registro-contenedor">
      <!-- Vista previa -->
      <div class="preview">
        <h3>Vista previa</h3>
        <p><strong>Vehículo:</strong> Ej. Volvo TR 430</p>
        <p><strong>Latitud:</strong> Ej. 25.6866</p>
        <p><strong>Longitud:</strong> Ej. -100.3161</p>
        <p><strong>Descripción:</strong> Detalles del punto</p>
      </div>

      <!-- Formulario -->
      <form class="registro-form">
        <label for="vehiculo">Vehículo:</label>
        <input type="text" id="vehiculo" placeholder="Ej. Volvo TR 430">

        <label for="latitud">Latitud:</label>
        <input type="text" id="latitud" placeholder="Ej. 25.6866">

        <label for="longitud">Longitud:</label>
        <input type="text" id="longitud" placeholder="Ej. -100.3161">

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" placeholder="Detalles del punto"></textarea>

        <button type="submit">Guardar</button>
      </form>
    </section>
  </main>
</body>
</html>
