<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Login</title>
  <link rel="stylesheet" href="../20_FrontEnd/styles.css">
</head>
<body>
  <!-- Sección del encabezado con logo y título -->
  <header>
    <div class="header-container">
      <!-- Logo alineado a la izquierda -->
      <div class="logo-container">
        <img src="../20_FrontEnd/img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <!-- Título centrado -->
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
  </header>

  <!-- Área de contenido principal -->
  <main>
    <!-- Sección del contenedor de login -->
    <section class="login-contenedor">
      <h2>Iniciar Sesión</h2>
      <!-- Formulario de login -->
      <form class="login-form" id="loginForm">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

        <button type="submit">Acceder</button>
      </form>
      <!-- Opciones adicionales de login -->
      <p class="login-extra">¿Olvidaste tu contraseña? 
        <a href="recuperar.html">Recupérala aquí</a>
      </p>
    </section>
  </main>
  <!-- Sección del pie de página -->
  <footer class="footer">
    <p>© 2025 TrackVer A&A. Todos los derechos reservados.</p>
  </footer>

  <script src="../20_JavaScript/index.js"></script>
</body>
</html>
