<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackVer A&A - Recuperar Contraseña</title>
  <link rel="stylesheet" href="../20_FrontEnd/styles.css">
</head>
<body>
  <!-- Sección del encabezado con logo y título -->
  <header>
    <div class="header-container">
      <div class="logo-container">
        <img src="../20_FrontEnd/img/logo.jpg" alt="Logo TrackVer A&A" class="logo">
      </div>
      <h1 class="titulo">TrackVer A&A</h1>
    </div>
  </header>

  <!-- Área de contenido principal -->
  <main>
    <!-- Sección del contenedor de recuperación de contraseña -->
    <section class="login-contenedor">
      <h2>Recuperar Contraseña</h2>
      <!-- Formulario de recuperación -->
      <form class="login-form" id="recuperarForm">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="Ingresa tu correo" required>

        <button type="submit">Enviar enlace de recuperación</button>
      </form>
      <!-- Enlace para volver al login -->
      <p class="login-extra">¿Recordaste tu contraseña? <a href="index.html">Inicia sesión aquí</a></p>
    </section>
  </main>
  <!-- Sección del pie de página -->
  <footer class="footer">
    <p>© 2025 TrackVer A&A. Todos los derechos reservados.</p>
  </footer>

  <script src="../20_JavaScript/recuperar.js"></script>
</body>
</html>
